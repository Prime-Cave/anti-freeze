name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: Build and attach DMG
    runs-on: macos-latest
    permissions:
      contents: write # create the release and upload the DMG
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CGO_CFLAGS: -mmacosx-version-min=13.0
      CGO_LDFLAGS: -mmacosx-version-min=13.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # for the version from git describe
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test
        run: go test ./...
      - name: Build unsigned DMG
        run: |
          make dmg VERSION="${GITHUB_REF_NAME#v}"
          cd build/out && shasum -a 256 Headroom.dmg > Headroom.dmg.sha256
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/out/Headroom.dmg build/out/Headroom.dmg.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Headroom $GITHUB_REF_NAME" --generate-notes \
            --notes "Unsigned build. The first time, open it, then allow it in System Settings › Privacy & Security › Open Anyway (see Install in the README)."
